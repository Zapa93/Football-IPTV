name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mono
        uses: mono/setup-mono@v1

      - name: Download WebGrab+Plus Binary
        run: |
          wget http://www.webgrabplus.com/sites/default/files/downloads/sw/v5.3.0/WebGrabPlus_V5.3.0_install.tar.gz
          tar -xzf WebGrabPlus_V5.3.0_install.tar.gz
          # Move the necessary binary to your root
          mv WebGrabPlus/bin/WebGrab+Plus.exe .

      - name: Run Scraper
        run: |
          mono WebGrab+Plus.exe "."

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
