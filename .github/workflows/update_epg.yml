name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # THIS IS THE MAGIC FIX FOR "NO INTERNET"
      - name: Fix Ping Permissions for WebGrab+Plus
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download and Extract WebGrab+Plus
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          cp -rp .wg++/* .

      - name: Run Scraper
        run: |
          DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
          echo "Found DLL at: $DLL_PATH"
          dotnet "$DLL_PATH" "$(pwd)"

      - name: Read the Log
        run: cat WebGrab++.log.txt || true

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
