name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Spoof Ping to Bypass Azure Firewall
        run: |
          # 1. Move the real ping command out of the way
          sudo mv /bin/ping /bin/ping_backup
          
          # 2. Create a fake ping command that outputs a perfect success message
          sudo tee /bin/ping > /dev/null << 'EOF'
          #!/bin/bash
          TARGET="${@: -1}"
          echo "PING $TARGET ($TARGET) 56(84) bytes of data."
          echo "64 bytes from $TARGET: icmp_seq=1 ttl=115 time=0.1 ms"
          echo "--- $TARGET ping statistics ---"
          echo "1 packets transmitted, 1 received, 0% packet loss, time 0ms"
          exit 0
          EOF
          
          # 3. Make the fake ping executable
          sudo chmod +x /bin/ping

      - name: Download and Extract WebGrab+Plus
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          cp -rp .wg++/* .

      - name: Run Scraper
        run: |
          DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
          dotnet "$DLL_PATH" "$(pwd)"

      - name: Read the Log
        run: cat WebGrab++.log.txt || true

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
