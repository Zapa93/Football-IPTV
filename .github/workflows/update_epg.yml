name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download and Extract WebGrab+Plus
        run: |
          # Download the 5.5 stable version
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          
          # Extract the files (creates a hidden .wg++ folder)
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          
          # Move everything from the hidden .wg++ folder to our working space
          cp -rp .wg++/* .

      - name: Run Scraper
        run: |
          # 1. Search for the exact location of the DLL file automatically
          DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
          echo "Found DLL at: $DLL_PATH"
          
          # 2. Run the DLL using .NET, and tell it to use the current folder for the config file
          dotnet "$DLL_PATH" "$(pwd)"

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
