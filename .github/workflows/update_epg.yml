name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download WebGrab+Plus
        run: |
          # Use the 2026 stable .NET version
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          # Prepare the environment
          mkdir -p bin
          cp -r WebGrabPlus/bin.net/* bin/
          cp WebGrabPlus/WebGrab+Plus.dll .

      - name: Run Scraper
        run: |
          # Run using dotnet instead of mono
          dotnet WebGrab+Plus.dll "."

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
