name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Spoof Ping to Bypass Azure Firewall
        run: |
          sudo mv /bin/ping /bin/ping_backup || true
          sudo tee /bin/ping > /dev/null << 'EOF'
          #!/bin/bash
          TARGET="${@: -1}"
          echo "PING $TARGET ($TARGET) 56(84) bytes of data."
          echo "64 bytes from $TARGET: icmp_seq=1 ttl=115 time=0.1 ms"
          echo "--- $TARGET ping statistics ---"
          echo "1 packets transmitted, 1 received, 0% packet loss, time 0ms"
          exit 0
          EOF
          sudo chmod +x /bin/ping

      - name: Download and Extract WebGrab+Plus
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          cp -rp .wg++/* .

      - name: Prepare Split Configs (For Swedish Channels)
        run: |
          mkdir part1 part2 || true
          cp WebGrab++.config1.xml part1/WebGrab++.config.xml || true
          cp WebGrab++.config2.xml part2/WebGrab++.config.xml || true
          cp *.ini part1/ 2>/dev/null || true
          cp *.ini part2/ 2>/dev/null || true

      - name: Run Scraper Part 1
        run: |
          if [ -f "part1/WebGrab++.config.xml" ]; then
            DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
            dotnet "$DLL_PATH" "$(pwd)/part1" || true
          fi

      - name: Run Scraper Part 2
        run: |
          if [ -f "part2/WebGrab++.config.xml" ]; then
            DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
            dotnet "$DLL_PATH" "$(pwd)/part2" || true
          fi

      - name: Download EPGShare01 Sports Guides
        run: |
          echo "Laddar ner sportguider från EPGShare01..."
          wget -qO uk.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz"
          wget -qO rs.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_RS1.xml.gz"
          wget -qO bein.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_BEIN1.xml.gz"
          wget -qO it.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz"
          gunzip *.gz

      - name: Merge all guides and fix Titles for App Sidebar
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          # === LÄGG TILL DINA SPORT-ID:N HÄR ===
          # Exakt de ID:n du använder i din M3U-fil för de utländska kanalerna.
          wanted_sport_channels = [
              'DAZN.1.it.it',
              'DAZN.2.it.it',
              'SkySportCalcio.it',
              'SkySport252.it',
              'TNT.Sports.1.HD.uk',
              'TNT.Sports.2.HD.uk',
              'TNT.Sports.3.HD.uk',
              'TNT.Sports.4.HD.uk',
              'TNT.Sports.5.HD.uk',
              'TNT.Sports.6.HD.uk',
              'TNT.Sports.7.HD.uk',
              'TNT.Sports.8.HD.uk',
              'TNT.Sports.9.HD.uk',
              'TNT.Sports.10.HD.uk',
              'TNT.Sports.1.HD.uk',
              'Premier.Sports.1.HD.uk',
              'Premier.Sports.2.HD.uk',
              'Premier.Sports.3.HD.uk',
              'beIN_SPORTS1_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS2_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS3_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS4_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS5_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS6_ENGLISH_Digital_Mono_AR.bein',
              'Arena.Sport.1.HD.(RS).rs',
              'Arena.Sport.2.HD.(RS).rs',
              'Arena.Sport.3.HD.(RS).rs',
              'Arena.Sport.4.HD.(RS).rs',
              'Arena.Sport.5.HD.(RS).rs',
              'Arena.Sport.6.HD.(RS).rs',
              # Lägg till dina Arena Sport, beIN och fler engelska kanaler här...
              # Se till att de är inom 'fnuttar' och separerade med kommatecken.
          ]
          # ======================================

          all_channels = []
          all_programmes = []

          def process_file(filename, is_epgshare=False):
              if not os.path.exists(filename): return
              print(f'Läser in {filename}...')
              try:
                  temp_tree = ET.parse(filename)
                  temp_root = temp_tree.getroot()
                  
                  # Spara kanaler (Filtrera om det är EPGShare)
                  for ch in temp_root.findall('channel'):
                      ch_id = ch.get('id')
                      if not is_epgshare or ch_id in wanted_sport_channels:
                          all_channels.append(ch)
                      
                  # Spara program (Filtrera om det är EPGShare, och fixa titlar!)
                  for prog in temp_root.findall('programme'):
                      ch_id = prog.get('channel')
                      if not is_epgshare or ch_id in wanted_sport_channels:
                          if is_epgshare:
                              title_elem = prog.find('title')
                              subtitle_elem = prog.find('sub-title')
                              
                              if title_elem is not None and subtitle_elem is not None and subtitle_elem.text:
                                  orig_title = title_elem.text.strip() if title_elem.text else ''
                                  sub_text = subtitle_elem.text.strip()
                                  
                                  if sub_text:
                                      if ' v ' in sub_text.lower() or ' vs ' in sub_text.lower() or '-' in sub_text:
                                          title_elem.text = f'{sub_text} ({orig_title})'
                                      else:
                                          title_elem.text = f'{orig_title}: {sub_text}'
                                          
                          all_programmes.append(prog)
              except Exception as e:
                  print(f'Kunde inte läsa {filename}: {e}')

          # 1. Läs in dina egna svenska WG++ skrapningar (Dessa filtreras INTE)
          process_file('part1/guide.xml', is_epgshare=False)
          process_file('part2/guide.xml', is_epgshare=False)

          # 2. Läs in de nya sport-guiderna (Dessa FILTRERAS stenhårt)
          process_file('uk.xml', is_epgshare=True)
          process_file('rs.xml', is_epgshare=True)
          process_file('bein.xml', is_epgshare=True)
          process_file('it.xml', is_epgshare=True)

          # 3. Bygg den slutgiltiga, bimmade super-filen
          new_root = ET.Element('tv')
          for ch in all_channels:
              new_root.append(ch)
          for prog in all_programmes:
              new_root.append(prog)
              
          tree = ET.ElementTree(new_root)
          tree.write('guide.xml', encoding='utf-8', xml_declaration=True)
          print('Succé! Skräpet är bortstädat och titlarna är fixade.')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update (Svenska + Sport): $(date)" || exit 0
          git push
