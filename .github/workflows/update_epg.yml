name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Spoof Ping to Bypass Azure Firewall
        run: |
          sudo mv /bin/ping /bin/ping_backup
          sudo tee /bin/ping > /dev/null << 'EOF'
          #!/bin/bash
          exit 0
          EOF
          sudo chmod +x /bin/ping

      - name: Download and Extract WebGrab+Plus
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          cp -rp .wg++/* .

      - name: Prepare Split Configs
        run: |
          # Skapa två mappar för att köra programmet två gånger utan att filerna krockar
          mkdir part1 part2
          cp WebGrab++.config1.xml part1/WebGrab++.config.xml
          cp WebGrab++.config2.xml part2/WebGrab++.config.xml
          # Kopiera dina .ini filer till båda mapparna
          cp *.ini part1/ || true
          cp *.ini part2/ || true

      - name: Run Scraper Part 1 (First 20 channels)
        run: |
          DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
          dotnet "$DLL_PATH" "$(pwd)/part1"

      - name: Run Scraper Part 2 (Remaining channels)
        run: |
          DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
          dotnet "$DLL_PATH" "$(pwd)/part2"

      - name: Merge both guides into one
        run: |
          # Använder Python (som redan finns på servern) för att sy ihop båda XML-filerna till en stor guide.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree1 = ET.parse('part1/guide.xml')
              root1 = tree1.getroot()
              tree2 = ET.parse('part2/guide.xml')
              for child in tree2.getroot():
                  root1.append(child)
              tree1.write('guide.xml', encoding='utf-8', xml_declaration=True)
              print('Filerna har slagits ihop framgångsrikt!')
          except Exception as e:
              print('Kunde inte slå ihop filerna:', e)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update (Merged configs): $(date)" || exit 0
          git push
