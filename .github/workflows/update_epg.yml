name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Spoof Ping to Bypass Azure Firewall
        run: |
          sudo mv /bin/ping /bin/ping_backup || true
          sudo tee /bin/ping > /dev/null << 'EOF'
          #!/bin/bash
          TARGET="${@: -1}"
          echo "PING $TARGET ($TARGET) 56(84) bytes of data."
          echo "64 bytes from $TARGET: icmp_seq=1 ttl=115 time=0.1 ms"
          echo "--- $TARGET ping statistics ---"
          echo "1 packets transmitted, 1 received, 0% packet loss, time 0ms"
          exit 0
          EOF
          sudo chmod +x /bin/ping

      - name: Download and Extract WebGrab+Plus
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          cp -rp .wg++/* .

      - name: Prepare Config (For Swedish Sports)
        run: |
          mkdir wg_run || true
          # Kopierar din config1.xml och döper om den så WebGrab hittar den
          cp WebGrab++.config1.xml wg_run/WebGrab++.config.xml || true
          cp *.ini wg_run/ 2>/dev/null || true

      - name: Run WebGrab+Plus
        run: |
          if [ -f "wg_run/WebGrab++.config.xml" ]; then
            DLL_PATH=$(find . -name "WebGrab+Plus.dll" | head -n 1)
            dotnet "$DLL_PATH" "$(pwd)/wg_run" || true
          fi

      - name: Download EPGShare01 Guides
        run: |
          echo "Laddar ner EPGShare01-guider..."
          wget -qO se.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz"
          wget -qO uk.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz"
          wget -qO rs.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_RS1.xml.gz"
          wget -qO bein.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_BEIN1.xml.gz"
          wget -qO it.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz"
          gunzip *.gz || true

      - name: Merge all guides and fix Titles
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          regular_channels = [
              '[SVT1HD].SVT1.HD.se',
              '[SVT2HD].SVT2.HD.se',
              '[TV3HD].TV3.HD.se',
              '[TV4HD].TV4.HD.se',
              '[KANL5HD].KANAL.5.HD.se',
              '[TV6HD].TV6.HD.se',
              '[SJUHD].Sjuan.HD.se',
              '[TV8HD].TV8.HD.se',
              '[KANAL9H].Kanal.9.HD.se',
              '[TV10HD].TV10.HD.se',
              '[KANL11H].Kanal.11.HD.se',
              '[TV12HD].TV12.HD.se',
              '[TLCSWHD].TLC.HD.se',
              '[MATKANS].Godare.se',
              '[COMSVHD].SVTB/SVT24.HD.se',
              '[KUNSKHD].Kunskapskanalen.HD.se',
              '[CNNEU].CNN.International.se',
              '[CNBCEHD].CNBC.HD.se',
              '[TV4FAKT].TV4.Fakta.se',
              '[ANIPLHD].Animal.Planet.HD.se',
              '[DISCOHD].Discovery.Channel.HD.se',
              '[DISCSCI].Discovery.Science.se',
              '[HISTOSD].History.se',
              '[H2HDSWE].H2.HD.se',
              '[HORSECT].Horse.&amp;.Country.TV.se',
              '[NATGWHD].National.Geographic.Wild.HD.se',
              '[NATGEHD].National.Geographic.HD.se',
              '[VIAEXPL].Viasat.Explore.se',
              '[VIAHIST].Viasat.History.se',
              '[VIANAT].Viasat.Nature.se',
              '[SPEXTV].Sport.Expressen.TV.se',
              '[MTVSWHD].MTV.HD.se',
              '[SFKANAL].SF.Kanalen.se',
              '[TV4FILM].TV4.Film.se',
              '[TV4GULD].TV4.Guld.se',
              '[TV4HISV].TV4.Hits.se',
              '[TV4STSV].TV4.Stars.se',
              '[FMACTHD].V.Film.Action.HD.se',
              '[VIAFAMI].V.Film.Family.se',
              '[VIAHTHD].V.Film.Hits.HD.se',
              '[VIAFILHD].V.Film.Premiere.HD.se',
              '[VIASEHD].V.Series.HD.se',
              '[SKYS2SV].SkyShowtime.2.se',
              '[EUROSHD].Eurosport.1.HD.se',
              '[EURSP2H].Eurosport.2.HD.se',
              '[TV4HOSV].TV4.Hockey.se',
              '[TV4MOSV].TV4.Motor.se',
              '[TV4TESV].TV4.Tennis.se',
              '[VGOLFHD].V.Sport.Golf.HD.se',
              '[VIASMHD].V.Sport.Motor.HD.se',
              '[VSPOVIS].V.Sport.Vinter.se',
              # Fyll på med dina vanliga svenska kanaler här. 
              # Se till att de har exakt samma tvg-id som i din M3U-fil!
          ]

          # === 2. SPORTKANALER från EPGShare01 (Utländsk sport) ===
          sports_channels = [
              'DAZN.1.it.it',
              'DAZN.2.it.it',
              'SkySportCalcio.it',
              'SkySport252.it',
              'TNT.Sports.1.HD.uk',
              'TNT.Sports.2.HD.uk',
              'TNT.Sports.3.HD.uk',
              'TNT.Sports.4.HD.uk',
              'TNT.Sports.5.HD.uk',
              'TNT.Sports.6.HD.uk',
              'TNT.Sports.7.HD.uk',
              'TNT.Sports.8.HD.uk',
              'TNT.Sports.9.HD.uk',
              'TNT.Sports.10.HD.uk',
              'Premier.Sports.1.HD.uk',
              'Premier.Sports.2.HD.uk',
              'Premier.Sports.3.HD.uk',
              'beIN_SPORTS1_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS2_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS3_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS4_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS5_ENGLISH_Digital_Mono_AR.bein',
              'beIN_SPORTS6_ENGLISH_Digital_Mono_AR.bein',
              'Arena.Sport.1.HD.(RS).rs',
              'Arena.Sport.2.HD.(RS).rs',
              'Arena.Sport.3.HD.(RS).rs',
              'Arena.Sport.4.HD.(RS).rs',
              'Arena.Sport.5.HD.(RS).rs',
              'Arena.Sport.6.HD.(RS).rs'
              # Fyll på med resten av dina utländska sportkanaler här
          ]
          # ==============================================================

          all_channels = []
          all_programmes = []

          def process_file(filename, filter_list=None, apply_magic=False):
              if not os.path.exists(filename): return
              print(f'Läser in {filename}...')
              try:
                  temp_tree = ET.parse(filename)
                  temp_root = temp_tree.getroot()
                  
                  for ch in temp_root.findall('channel'):
                      ch_id = ch.get('id')
                      if filter_list is None or ch_id in filter_list:
                          all_channels.append(ch)
                      
                  for prog in temp_root.findall('programme'):
                      ch_id = prog.get('channel')
                      
                      if filter_list is None or ch_id in filter_list:
                          if apply_magic:
                              title_elem = prog.find('title')
                              subtitle_elem = prog.find('sub-title')
                              desc_elem = prog.find('desc')
                              
                              orig_title = title_elem.text.strip() if (title_elem is not None and title_elem.text) else ''
                              sub_text = subtitle_elem.text.strip() if (subtitle_elem is not None and subtitle_elem.text) else ''
                              desc_text = desc_elem.text.strip() if (desc_elem is not None and desc_elem.text) else ''
                              
                              match_found = False
                              
                              # 1. Kolla sub-title (Vanligt för UK/Italien)
                              if sub_text:
                                  if ' v ' in sub_text.lower() or ' vs ' in sub_text.lower() or ' - ' in sub_text:
                                      title_elem.text = f'{sub_text} ({orig_title})'
                                      match_found = True
                                  else:
                                      title_elem.text = f'{orig_title}: {sub_text}'
                                      
                              # 2. Kolla beskrivningen (Bra för WebGrabs svenska sportkanaler)
                              if not match_found and desc_text:
                                  first_sentence = desc_text.split('.')[0]
                                  if ' - ' in first_sentence or ' v ' in first_sentence.lower():
                                      if len(first_sentence) < 65:
                                          title_elem.text = f'{first_sentence} ({orig_title})'
                                          
                          all_programmes.append(prog)
              except Exception as e:
                  print(f'Kunde inte läsa {filename}: {e}')

          # 1. Läs in WebGrab-filen (Svensk Sport). Behåll ALLA kanaler i den, och applicera magin!
          process_file('wg_run/guide.xml', filter_list=None, apply_magic=True)

          # 2. Läs in Vanliga Svenska kanaler (EPGShare01). INGEN magi.
          process_file('se.xml', filter_list=regular_channels, apply_magic=False)

          # 3. Läs in Utländsk Sport (EPGShare01). MED magi.
          process_file('uk.xml', filter_list=sports_channels, apply_magic=True)
          process_file('rs.xml', filter_list=sports_channels, apply_magic=True)
          process_file('bein.xml', filter_list=sports_channels, apply_magic=True)
          process_file('it.xml', filter_list=sports_channels, apply_magic=True)

          # Bygg ihop och spara
          new_root = ET.Element('tv')
          for ch in all_channels:
              new_root.append(ch)
          for prog in all_programmes:
              new_root.append(prog)
              
          tree = ET.ElementTree(new_root)
          tree.write('guide.xml', encoding='utf-8', xml_declaration=True)
          print('Succé! WebGrab och EPGShare är ihopsydda.')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated Hybrid EPG update: $(date)" || exit 0
          git push
