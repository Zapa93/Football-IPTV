name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WebGrab+Plus
        run: |
          chmod -R 777 ${{ github.workspace }}
          # We use the 'lsio-config' style which is more reliable
          docker run --rm \
            -v ${{ github.workspace }}:/config \
            -v ${{ github.workspace }}:/data \
            -e TZ=Europe/Stockholm \
            lscr.io/linuxserver/webgrabplus:latest \
            /defaults/update.sh  # This is the built-in trigger script
            
      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
