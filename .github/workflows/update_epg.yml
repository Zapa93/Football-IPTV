name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Download WebGrab+Plus Binary
        run: |
          wget http://www.webgrabplus.com/sites/default/files/downloads/sw/v5.3.0/WebGrabPlus_V5.3.0_install.tar.gz
          tar -xzf WebGrabPlus_V5.3.0_install.tar.gz
          # Moves the executable to the root so it can find your config
          mv WebGrabPlus/bin/WebGrab+Plus.exe .

      - name: Run Scraper
        run: |
          # The "." tells it to use the current folder for config and siteinis
          mono WebGrab+Plus.exe "."

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          # Only commit if guide.xml actually changed
          git commit -m "Automated update: $(date)" || exit 0
          git push
