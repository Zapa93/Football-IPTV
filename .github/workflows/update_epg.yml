name: Update EPG
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download and Install WebGrab+Plus
        run: |
          # 1. Download
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          
          # 2. Extract
          tar -xzf WebGrabPlus_5.5_install.tar.gz
          
          # 3. Move EVERYTHING out of the hidden .wg++ folder to the root
          # This ensures the .dll and the bin folder are exactly where dotnet expects them
          cp -rp .wg++/* .
          
          # 4. Final check: Ensure the bin folder from bin.net is correctly placed
          mkdir -p bin
          cp -rp bin.net/* bin/ || true

      - name: Run Scraper
        run: |
          # We call the DLL directly. The "." tells it to use the current folder for your config.
          dotnet WebGrab+Plus.dll "."

      - name: Commit and Push
        run: |
          git config --global user.name "EPG-Bot"
          git config --global user.email "bot@github.com"
          git add guide.xml
          git commit -m "Automated update: $(date)" || exit 0
          git push
